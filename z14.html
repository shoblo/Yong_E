<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拨</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4eedd;--ink:#2b2b2b;--seal:#c8322b;--soft:#8a8578}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);
  background:var(--paper) url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'220'%20height%3D'220'%3E%3Cfilter%20id%3D'n'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.75'%20numOctaves%3D'2'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%20.42%200%200%200%200%20.32%200%200%200%200%20.18%200%200%200%20.09%200'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'100%25'%20height%3D'100%25'%20filter%3D'url(%23n)'%2F%3E%3C%2Fsvg%3E");
  font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  -webkit-font-smoothing:antialiased}
.brush{font-family:'Ma Shan Zheng','KaiTi','STKaiti','Kaiti SC','Songti SC',serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
}

main{max-width:520px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.sq{position:relative;width:min(80vw,44dvh,360px);width:min(80vw,360px);aspect-ratio:1;background:var(--bg,#fff);
  border:3px solid var(--ink);border-radius:10px;box-shadow:4px 5px 0 rgba(43,43,43,.18);overflow:hidden;transition:background .35s}
.sq .gh,.sq .gv{position:absolute;pointer-events:none}
.sq .gh{left:0;right:0;top:50%;border-top:2px dashed var(--gl,rgba(43,43,43,.2))}
.sq .gv{top:0;bottom:0;left:50%;border-left:2px dashed var(--gl,rgba(43,43,43,.2))}
.pic{width:min(80vw,360px);height:min(46vw,200px);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);border:3px solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 rgba(43,43,43,.18)}
.pic[hidden]{display:none}
.pic svg{height:78%;width:auto;max-width:90%}
#hz{position:absolute;inset:0;width:100%;height:100%}
.word{border:0;background:none;padding:0 18px;line-height:1.1;font-size:96px;min-height:112px;min-width:140px;
  font-family:'Ma Shan Zheng','KaiTi','STKaiti','Songti SC',serif;color:var(--ink)}
.word.en{font-family:'Noto Serif SC',Georgia,serif;font-size:60px;font-weight:700;letter-spacing:1px}
.word.out{-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.vbs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:-6px}
.vb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;min-height:68px;padding:6px 8px;
  background:rgba(255,255,255,.55);border:2.5px solid var(--ink);border-radius:16px;font-size:15px;box-shadow:2px 3px 0 rgba(43,43,43,.2)}
.vb[aria-pressed="true"]{background:#fff;box-shadow:inset 0 0 0 3px var(--seal);border-color:var(--seal)}
.vb .sw{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink)}
.vb svg{width:40px;height:40px}
.vbs.c{gap:6px;flex-wrap:nowrap}
.vb.color{min-width:0;flex:1 1 0;padding:6px 2px;min-height:64px}
.vb.color .sw{width:34px;height:34px}
h2{font-family:'Ma Shan Zheng','Noto Serif SC','KaiTi','Songti SC',serif;font-weight:400;font-size:32px;margin:14px 0 0;letter-spacing:2px}
.fr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;margin:0;padding:0;list-style:none}
.fr li{display:flex}
.fb{display:flex;align-items:center;gap:10px;width:100%;min-height:76px;padding:8px 12px;text-align:left;background:rgba(255,255,255,.55);
  border:2.5px solid var(--ink);border-radius:18px;box-shadow:2px 3px 0 rgba(43,43,43,.2);font-family:'Noto Serif SC','Songti SC',serif}
.fb:active{transform:translateY(2px)}
.fb.en{background:#fff;border-color:var(--seal);box-shadow:inset 0 0 0 2px var(--seal)}
.fb.en span{font-size:19px;overflow-wrap:normal}
.fb.en.long span{font-size:15px}
.fb span{min-width:0}
.fr svg{flex:none;width:52px;height:52px}
.fr span{font-size:26px;font-weight:700;line-height:1.15}
.fr b{color:var(--seal)}
.back{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;min-width:200px;margin-top:10px;padding:10px 28px;
  border:3px solid var(--ink);border-radius:999px;background:#fff;text-decoration:none;font-size:28px;
  font-family:'Ma Shan Zheng','KaiTi','Songti SC',serif;box-shadow:3px 4px 0 rgba(43,43,43,.25)}
.back:active{transform:translateY(2px)}
</style></head>
<body><main>
<div class="pic" id="art" hidden></div>
<div class="sq" id="sq"><div class="gh"></div><div class="gv"></div><svg id="hz" viewBox="0 0 1024 1024" role="img" aria-label="拨"></svg></div>
<button class="word" id="word" type="button">拨</button>

<h2>Good friends</h2>
<ul class="fr"><li><button class="fb" type="button" data-en="drum" aria-pressed="false"><svg class="" viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 50v10" stroke-width="3.5"/><ellipse cx="32" cy="26" rx="20" ry="10" fill="#e8584f"/><path d="M12 26v6c0 6 9 10 20 10s20-4 20-10v-6" fill="#e8584f"/><ellipse cx="32" cy="26" rx="20" ry="10" fill="#f6e3b4"/><circle cx="54" cy="18" r="4" fill="#ffd23f"/><path d="M52 22l-4 6"/></svg><span><b>拨</b>浪鼓</span></button></li><li><button class="fb" type="button" data-en="splash" aria-pressed="false"><svg class="" viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 46c8-6 12 6 20 0s12 6 20 0 8 4 12 2" stroke="#2f7fd0" stroke-width="4"/><path d="M20 34c-4-6-2-12 0-16 2 4 4 10 0 16zM34 30c-4-8-2-16 0-22 2 6 4 14 0 22zM46 36c-3-5-1-10 1-13 2 3 3 8-1 13z" fill="#8ac7ee"/></svg><span><b>拨</b>水</span></button></li><li><button class="fb" type="button" data-en="dial" aria-pressed="false"><svg class="" viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="16" y="6" width="32" height="52" rx="6" fill="#ddd"/><rect x="20" y="12" width="24" height="16" rx="2" fill="#bfe3f5"/><circle cx="24" cy="38" r="3" fill="#2b2b2b"/><circle cx="32" cy="38" r="3" fill="#2b2b2b"/><circle cx="40" cy="38" r="3" fill="#2b2b2b"/><circle cx="24" cy="48" r="3" fill="#2b2b2b"/><circle cx="32" cy="48" r="3" fill="#2b2b2b"/><circle cx="40" cy="48" r="3" fill="#2b2b2b"/></svg><span><b>拨</b>号</span></button></li></ul>
<a class="back" href="./"><svg class="" viewBox="0 0 64 64" width="30" height="30" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(-90 32 32)"><path d="M32 54V12M15 29L32 12l17 17" stroke="#2f7fd0" stroke-width="6"/></g></svg>回到诗</a>
</main>
<script>
(function(){
var DATA={"拨":{"strokes":["M 322 514 Q 386 535 389 537 Q 396 544 392 553 Q 385 563 355 569 Q 339 572 324 568 L 274 549 Q 174 521 131 513 Q 95 504 122 490 Q 168 469 217 486 Q 244 493 273 501 L 322 514 Z","M 267 319 Q 266 234 263 125 Q 262 103 249 94 Q 243 91 181 99 Q 148 111 151 101 Q 152 94 172 79 Q 230 30 245 3 Q 263 -28 277 -31 Q 292 -32 306 3 Q 325 48 324 121 Q 317 242 318 361 L 318 391 Q 318 452 322 514 L 324 568 Q 340 709 346 724 Q 362 754 308 777 Q 274 796 255 790 Q 237 783 253 760 Q 274 733 275 699 Q 276 683 274 549 L 273 501 Q 272 441 269 362 L 267 319 Z","M 269 362 Q 68 245 67 244 Q 52 238 50 229 Q 50 220 64 207 Q 83 194 105 186 Q 117 183 139 204 Q 211 276 267 319 L 318 361 Q 366 400 373 408 Q 379 421 368 420 Q 352 419 318 391 L 269 362 Z","M 603 487 Q 681 511 824 513 Q 843 512 851 518 Q 857 522 851 534 Q 845 544 810 561 Q 792 570 712 550 Q 696 550 615 527 L 559 512 Q 525 503 491 491 Q 479 485 477 489 Q 473 493 476 504 Q 492 568 501 587 Q 508 600 498 611 Q 482 633 456 646 Q 443 652 435 645 Q 429 641 437 624 Q 450 597 445 561 Q 435 507 410 484 Q 398 471 403 459 Q 410 441 427 426 Q 439 416 454 428 Q 487 458 548 473 L 603 487 Z","M 560 370 Q 585 431 603 487 L 615 527 Q 630 585 641 644 Q 651 717 664 751 Q 674 764 668 778 Q 653 797 623 812 Q 605 825 593 821 Q 580 814 586 801 Q 602 773 597 720 Q 578 587 559 512 L 548 473 Q 500 314 369 146 Q 363 139 361 134 Q 357 124 368 125 Q 395 125 482 234 Q 498 258 515 284 L 527 304 Q 534 320 544 336 L 560 370 Z","M 680 172 Q 714 226 737 304 Q 744 338 763 356 Q 779 369 761 385 Q 740 401 708 414 Q 687 421 666 410 Q 620 385 560 370 C 531 362 514 331 544 336 Q 556 336 660 364 Q 679 371 680 350 Q 680 284 641 209 L 619 172 Q 606 156 591 139 Q 539 90 405 50 Q 389 46 399 38 Q 406 32 435 36 Q 583 54 651 132 L 680 172 Z","M 651 132 Q 694 77 772 6 Q 800 -16 841 -8 Q 896 -1 936 6 Q 949 7 961 14 Q 968 21 957 29 Q 944 38 827 77 Q 758 104 680 172 L 641 209 Q 613 240 581 276 Q 563 298 532 304 Q 529 305 527 304 C 497 309 490 301 515 284 Q 551 263 619 172 L 651 132 Z","M 737 659 Q 764 637 792 610 Q 805 600 819 600 Q 829 600 833 613 Q 837 626 828 653 Q 819 681 732 702 Q 717 706 712 703 Q 708 699 709 687 Q 713 677 737 659 Z"],"medians":[[[124,503],[187,502],[335,545],[383,545]],[[262,774],[278,766],[309,733],[294,436],[293,112],[287,81],[270,51],[208,74],[170,92],[168,99],[157,99]],[[62,227],[109,226],[365,412]],[[443,638],[462,619],[474,594],[446,469],[470,467],[651,519],[748,535],[797,538],[843,526]],[[598,808],[626,775],[631,757],[593,540],[569,459],[542,386],[493,289],[444,215],[370,133]],[[551,342],[571,358],[682,389],[703,381],[718,360],[702,288],[681,229],[656,182],[620,134],[580,102],[527,75],[443,48],[405,43]],[[522,287],[536,288],[563,269],[693,124],[802,39],[951,19]],[[717,697],[800,643],[818,615]]]}}, CFG={"start":"拨","kind":null,"items":[],"en":"push"};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var sq=document.getElementById('sq'),hz=document.getElementById('hz'),art=document.getElementById('art'),word=document.getElementById('word');
var cur=CFG.start,showEn=false,raf=0,state=null;
function item(ch){for(var i=0;i<CFG.items.length;i++)if(CFG.items[i].ch===ch)return CFG.items[i];return null}
function enOf(ch){var it=item(ch);return it?it.en:CFG.en}
function mlen(m){var s=0;for(var i=1;i<m.length;i++){s+=Math.hypot(m[i][0]-m[i-1][0],m[i][1]-m[i-1][1])}return s}
function build(ch,fg){
  var d=DATA[ch],ns='http://www.w3.org/2000/svg';
  var defs='',ghost='',ink='';
  d.strokes.forEach(function(p,i){
    defs+='<clipPath id="cp'+i+'"><path d="'+p+'"/></clipPath>';
    ghost+='<path d="'+p+'"/>';
    var m=d.medians[i],pts='M'+m[0][0]+' '+m[0][1];
    for(var k=1;k<m.length;k++)pts+=' L'+m[k][0]+' '+m[k][1];
    if(m.length===1)pts+=' L'+m[0][0]+' '+m[0][1];
    ink+='<g clip-path="url(#cp'+i+')"><path class="ms" d="'+pts+'" pathLength="1" fill="none" stroke="'+fg+'" stroke-width="190" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="1" stroke-opacity="0"/></g>';
  });
  hz.innerHTML='<defs>'+defs+'</defs><g transform="scale(1,-1) translate(0,-900)"><g fill="'+fg+'" fill-opacity=".13">'+ghost+'</g><g id="ink">'+ink+'</g></g>';
  var ms=hz.querySelectorAll('.ms'),lens=d.medians.map(mlen),t=0,sched=[];
  lens.forEach(function(L){var dur=.4+L/1100;sched.push({s:t,d:dur});t+=dur+.14});
  return {ms:ms,sched:sched,draw:t,inkG:hz.querySelector('#ink')};
}
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function frame(c){
  var s=state,hold=1.4,fade=.6;
  for(var i=0;i<s.ms.length;i++){
    var p=Math.max(0,Math.min(1,(c-s.sched[i].s)/s.sched[i].d));
    s.ms[i].setAttribute('stroke-dashoffset',String(1-ease(p)));
    s.ms[i].setAttribute('stroke-opacity',p>0?'1':'0');
  }
  var o=1;if(c>s.draw+hold)o=Math.max(0,1-(c-s.draw-hold)/fade);
  s.inkG.setAttribute('opacity',String(o));
}
function play(ch,fg){
  cancelAnimationFrame(raf);state=build(ch,fg);
  if(reduce){frame(1e6-1+0);state.inkG.setAttribute('opacity','1');for(var i=0;i<state.ms.length;i++){state.ms[i].setAttribute('stroke-dashoffset','0');state.ms[i].setAttribute('stroke-opacity','1')}return}
  var t0=performance.now(),cycle=state.draw+1.4+.6+.45;
  (function loop(now){var c=((now-t0)/1000)%cycle;frame(c);raf=requestAnimationFrame(loop)})(t0);
}
function show(ch){
  cur=ch;showEn=false;var it=item(ch);
  var bg='#ffffff',fg='#2b2b2b',gl='rgba(43,43,43,.2)',outline=false,col='';
  art.innerHTML='';
  if(CFG.kind==='color'&&it){bg=it.color;fg=it.fg;col=it.color;outline=true;gl=fg==='#ffffff'?'rgba(255,255,255,.35)':'rgba(43,43,43,.2)'}
  else if(CFG.kind==='art'&&it){art.innerHTML=CFG.icons[ch]||''}
  sq.style.setProperty('--bg',bg);sq.style.setProperty('--gl',gl);
  word.textContent=ch;word.className='word'+(outline?' out':'');word.style.color=col||'';
  word.setAttribute('aria-label',ch);
  var bs=document.querySelectorAll('.vb');for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',bs[i].getAttribute('data-ch')===ch?'true':'false');
  play(ch,fg);
}
word.addEventListener('click',function(){
  showEn=!showEn;
  if(showEn){word.textContent=enOf(cur);word.classList.add('en');word.classList.remove('out')}
  else{var it=item(cur);word.textContent=cur;word.classList.remove('en');if(CFG.kind==='color'&&it)word.classList.add('out')}
});
var bs=document.querySelectorAll('.vb');
for(var i=0;i<bs.length;i++)bs[i].addEventListener('click',function(){show(this.getAttribute('data-ch'))});
var fbs=document.querySelectorAll('.fb');
for(var f=0;f<fbs.length;f++){(function(b){var sp=b.querySelector('span'),zh=sp.innerHTML,en=b.getAttribute('data-en');
  b.addEventListener('click',function(){var on=!b.classList.contains('en');b.classList.toggle('en',on);b.classList.toggle('long',on&&en.length>=9);b.setAttribute('aria-pressed',on?'true':'false');sp.innerHTML=on?en:zh})})(fbs[f])}
show(cur);
})();
</script>
